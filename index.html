<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel 11ª DPE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Segoe UI,Arial;background:#f4f6f8;color:#1f2937}
header{background:#087aa8;color:#fff;padding:16px 28px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1400px;margin:auto;padding:24px}.box,.kpi,.table{background:#fff;border:1px solid #e1e6eb;border-radius:12px;box-shadow:0 1px 4px #0001}
.box{padding:20px}.login{max-width:400px;margin:90px auto}
input,select,textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccd3da;border-radius:8px;box-sizing:border-box}
button{padding:10px 14px;border:0;border-radius:8px;background:#087aa8;color:#fff;cursor:pointer;margin-right:6px}.light{background:#eef2f5;color:#333}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi{padding:15px}.n{font-size:27px;font-weight:700;margin-top:5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:230px;margin:0}.toolbar select{width:auto;margin:0}
.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e7ebef;text-align:left;font-size:12px}th{background:#f8fafc;font-size:10px;color:#6b7280;text-transform:uppercase}
.badge{padding:5px 8px;border-radius:99px;font-size:10px;font-weight:700;background:#eef2f5}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1e40af}.yellow{background:#fef3c7;color:#92400e}.purple{background:#e0e7ff;color:#3730a3}
.modalbg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center}.modal{width:min(720px,94%);background:#fff;border-radius:12px;padding:20px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.err{color:#b91c1c;font-size:12px;margin:8px 0}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><b>Painel 11ª DPE</b><div style="font-size:11px">Organização de expedientes</div></div><div id="user"></div></header>
<main><div id="app"></div></main>
<div id="modal" class="modalbg"><div class="modal">
<h3 id="mt">Processo</h3>
<div class="twocol">
<div><label>Número do processo</label><input id="p"></div>
<div><label>Assunto</label><input id="a"></div>
<div><label>Expediente / pendência</label><input id="e"></div>
<div><label>Data de entrada</label><input id="entry" type="date"></div>
<div><label>Prazo</label><input id="d" type="date"></div>
<div><label>Prioridade</label><select id="priority"><option>Normal</option><option>Baixa</option><option>Alta</option><option>Urgente</option></select></div>
<div><label>Status</label><select id="s">
<option>Aguardando triagem</option><option>11ª DPE</option><option>Outra DPE</option><option>Ciência</option><option>Dúvida</option><option>Em andamento</option><option>Aguardando</option><option>Concluído</option>
</select></div>
<div><label>Situação da tarefa</label><select id="task">
<option>Não iniciada</option><option>Em elaboração</option><option>Aguardando documento</option><option>Aguardando atendimento</option><option>Revisão</option><option>Protocolada</option><option>Concluída</option>
</select></div>
<div><label>Responsável</label><input id="r" type="text" autocomplete="off" placeholder="Digite o nome do responsável"></div>
</div>
<label>Observações</label><textarea id="n" rows="4"></textarea>
<button onclick="saveProc()">Salvar</button><button class="light" onclick="closeM()">Cancelar</button>
</div></div>

<script>
const SUPABASE_URL='https://hqilkonhjpjkdosywekz.supabase.co';
const SUPABASE_KEY='sb_publishable_DKANnEXKl96OwvbllC3HsQ_jaoKjku0';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let edit=null;

const statuses=['Aguardando triagem','11ª DPE','Outra DPE','Ciência','Dúvida','Em andamento','Aguardando','Concluído'];

function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(s){
 let c=s==='11ª DPE'?'green':s==='Outra DPE'?'red':s==='Ciência'?'blue':s==='Dúvida'?'yellow':s==='Em andamento'?'purple':'';
 return `<span class="badge ${c}">${esc(s)}</span>`;
}
function badgePriority(s){
 let c=s==='Urgente'?'red':s==='Alta'?'yellow':s==='Baixa'?'blue':'';
 return `<span class="badge ${c}">${esc(s||'Normal')}</span>`;
}

function login(){
 document.getElementById('app').innerHTML=`
 <div class="box login">
  <h2>Acesso</h2>
  <p style="font-size:12px;color:#6b7280">Entre ou crie sua conta. O painel é independente do PJe.</p>
  <input id="email" type="email" placeholder="E-mail">
  <input id="pass" type="password" placeholder="Senha">
  <div class="err" id="err"></div>
  <button onclick="signIn()">Entrar</button>
  <button class="light" onclick="signUp()">Criar conta</button>
 </div>`;
}

async function signIn(){
 const email=document.getElementById('email').value;
 const password=document.getElementById('pass').value;
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error)document.getElementById('err').textContent=error.message;
}

async function signUp(){
 const email=document.getElementById('email').value;
 const password=document.getElementById('pass').value;
 if(!email||!password){document.getElementById('err').textContent='Informe e-mail e senha.';return}
 const {data,error}=await db.auth.signUp({email,password});
 if(error)document.getElementById('err').textContent=error.message;
 else document.getElementById('err').textContent=data.session?'Conta criada.':'Conta criada. Verifique o e-mail para confirmar o acesso.';
}

async function boot(){
 const {data:{session}}=await db.auth.getSession();
 if(session)dashboard(session.user);else login();
 db.auth.onAuthStateChange((_e,s)=>{if(s)dashboard(s.user);else login()});
}

async function dashboard(u){
 document.getElementById('user').innerHTML=`${esc(u.email)} <button class="light" onclick="db.auth.signOut()">Sair</button>`;
 document.getElementById('app').innerHTML=`
 <div class="grid">
  <div class="kpi">Total<div class="n" id="k1">0</div></div>
  <div class="kpi">Triagem<div class="n" id="k2">0</div></div>
  <div class="kpi">11ª DPE<div class="n" id="k3">0</div></div>
  <div class="kpi">Outra DPE<div class="n" id="k4">0</div></div>
  <div class="kpi">Próximos 7 dias<div class="n" id="k5">0</div></div>
 </div>
 <div class="toolbar">
  <input id="q" placeholder="Pesquisar processo, assunto ou pendência..." oninput="load()">
  <select id="fs" onchange="load()"><option value="">Todos os status</option>${statuses.map(x=>`<option>${x}</option>`).join('')}</select>
  <button onclick="openM()">+ Cadastrar processo</button>
 </div>
 <div class="box" style="padding:12px 16px;margin-bottom:12px;font-size:12px;color:#4b5563">
 <b>Fluxo sugerido:</b> Triagem → definição da DPE → atribuição → execução → revisão → protocolada/concluída.
 </div>
 <div class="table"><table><thead><tr><th>Processo</th><th>Assunto</th><th>Pendência</th><th>Prazo</th><th>Prioridade</th><th>Status</th><th>Tarefa</th><th>Responsável</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
 load();
}

async function load(){
 const q=document.getElementById('q')?.value||'';
 const fs=document.getElementById('fs')?.value||'';
 let query=db.from('processes').select('*').order('deadline',{ascending:true,nullsFirst:false});
 if(fs)query=query.eq('status',fs);
 const {data,error}=await query;
 if(error){document.getElementById('tb').innerHTML=`<tr><td colspan="9">Erro: ${esc(error.message)}</td></tr>`;return}
 const rows=(data||[]).filter(x=>!q||[x.process_number,x.subject,x.pending,x.notes,x.responsible_name,x.responsible_id,x.priority,x.task_status].join(' ').toLowerCase().includes(q.toLowerCase()));
 document.getElementById('tb').innerHTML=rows.map(x=>`
 <tr><td><b>${esc(x.process_number)}</b></td><td>${esc(x.subject)}</td><td>${esc(x.pending)}</td>
 <td>${x.deadline?new Date(x.deadline+'T00:00:00').toLocaleDateString('pt-BR'):'—'}</td>
 <td>${badgePriority(x.priority)}</td><td>${badge(x.status)}</td><td>${esc(x.task_status||'Não iniciada')}</td><td>${esc((x.responsible_name||x.responsible_id||'—'))}</td>
 <td><button class="light" onclick='openM(${JSON.stringify(x)})'>Abrir</button></td></tr>`).join('')||
 '<tr><td colspan="9" style="text-align:center;padding:35px">Nenhum processo cadastrado.</td></tr>';
 document.getElementById('k1').textContent=data.length;
 document.getElementById('k2').textContent=data.filter(x=>x.status==='Aguardando triagem').length;
 document.getElementById('k3').textContent=data.filter(x=>x.status==='11ª DPE').length;
 document.getElementById('k4').textContent=data.filter(x=>x.status==='Outra DPE').length;
 const now=new Date();now.setHours(0,0,0,0);const lim=new Date(now);lim.setDate(lim.getDate()+7);
 document.getElementById('k5').textContent=data.filter(x=>x.deadline&&new Date(x.deadline+'T00:00:00')>=now&&new Date(x.deadline+'T00:00:00')<=lim).length;
}

function openM(x){
 edit=x||null;
 document.getElementById('mt').textContent=x?'Editar processo':'Cadastrar processo';
 p.value=x?.process_number||'';a.value=x?.subject||'';e.value=x?.pending||'';entry.value=x?.entry_date||'';d.value=x?.deadline||'';
 priority.value=x?.priority||'Normal';s.value=x?.status||'Aguardando triagem';task.value=x?.task_status||'Não iniciada';r.value=x?.responsible_name||'';n.value=x?.notes||'';
 modal.style.display='flex';
}
function closeM(){modal.style.display='none'}

async function saveProc(){
 const {data:{user}}=await db.auth.getUser();
 const payload={process_number:p.value.trim(),subject:a.value.trim(),pending:e.value.trim(),entry_date:entry.value||null,deadline:d.value||null,priority:priority.value||'Normal',status:s.value,task_status:task.value||'Não iniciada',responsible_name:r.value.trim()||null,notes:n.value.trim(),updated_at:new Date().toISOString()};
 if(!payload.process_number){alert('Informe o número do processo.');return}
 const res=edit?await db.from('processes').update(payload).eq('id',edit.id):await db.from('processes').insert({...payload,created_by:user?.id||null});
 if(res.error)alert(res.error.message);else{closeM();load()}
}

boot();
</script>
</body>
</html>
